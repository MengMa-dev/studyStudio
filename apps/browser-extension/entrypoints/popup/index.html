<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Study Studio</title>
    <style>
      body {
        font: 14px system-ui;
        width: 300px;
        padding: 12px;
      }
      input,
      textarea,
      button {
        box-sizing: border-box;
        width: 100%;
        margin: 6px 0;
        padding: 8px;
      }
      textarea {
        height: 80px;
      }
    </style>
  </head>
  <body>
    <strong>Study Studio Collector</strong>
    <input id="url" placeholder="本地服务地址" value="http://127.0.0.1:43118" />
    <input id="token" placeholder="配对令牌" />
    <button id="save">保存连接</button>
    <textarea id="note" placeholder="记一条学习备注…"></textarea>
    <button id="add-note">保存备注</button>
    <p id="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
